server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Hide Nginx version from response headers
    server_tokens off;

    # -------------------------------------------------------------------------
    # Security headers
    # -------------------------------------------------------------------------

    # Deny embedding in any iframe (clickjacking protection)
    add_header X-Frame-Options "DENY" always;

    # Prevent MIME-type sniffing
    add_header X-Content-Type-Options "nosniff" always;

    # NOTE: X-XSS-Protection is intentionally OMITTED.
    # The header is deprecated in modern browsers and "1; mode=block" can be
    # abused in legacy IE/Edge parsers. Helmet disables it for the same reason.

    # Don't leak full Referrer URL to third-party origins
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Content Security Policy for the React SPA
    # - scripts/styles: self + Razorpay SDK
    # - connect: API server + Cloudinary + Google OAuth + Razorpay
    # - images: self + Cloudinary CDN + data URIs (avatars)
    # - frame-src: Razorpay checkout iframe + Google OAuth popup
    add_header Content-Security-Policy "
        default-src 'self';
        script-src  'self' 'unsafe-inline' https://checkout.razorpay.com https://accounts.google.com;
        style-src   'self' 'unsafe-inline' https://fonts.googleapis.com;
        font-src    'self' https://fonts.gstatic.com;
        img-src     'self' data: blob: https://res.cloudinary.com https://lh3.googleusercontent.com;
        connect-src 'self' https://api.razorpay.com https://res.cloudinary.com https://oauth2.googleapis.com https://accounts.google.com;
        frame-src   https://api.razorpay.com https://accounts.google.com;
        object-src  'none';
        base-uri    'self';
        form-action 'self';
        upgrade-insecure-requests;
    " always;

    # Lock down browser features not used by the app
    add_header Permissions-Policy "
        camera=(),
        microphone=(),
        geolocation=(),
        payment=(self),
        usb=(),
        fullscreen=(self)
    " always;

    # -------------------------------------------------------------------------
    # Gzip compression
    # -------------------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # -------------------------------------------------------------------------
    # Routing
    # -------------------------------------------------------------------------

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static assets caching (Vite hashes filenames, so safe to cache 1 year)
    location /assets {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Disable caching for HTML (SPA shell — must always be fresh)
    location ~* \.html$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}

